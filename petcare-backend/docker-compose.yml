services:
  postgres:
    image: postgres:17-alpine
    container_name: petcare_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-petcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petcare123}
      POSTGRES_DB: ${POSTGRES_DB:-petcare}
      TZ: America/Bogota
    volumes:
      - petcare_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petcare} -d ${POSTGRES_DB:-petcare}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - PETCARE
    restart: unless-stopped

  pgweb:
    image: sosedoff/pgweb
    container_name: petcare_pgweb
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER:-petcare}:${POSTGRES_PASSWORD:-petcare123}@postgres:5432/${POSTGRES_DB:-petcare}?sslmode=disable
    ports:
      - "127.0.0.1:${PGWEB_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - PETCARE
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: petcare-backend
    container_name: petcare_backend
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-petcare}:${POSTGRES_PASSWORD:-petcare123}@postgres:5432/${POSTGRES_DB:-petcare}
      JWT_SECRET: ${JWT_SECRET:-petcare-clave-de-desarrollo-cambiar-en-produccion}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      TZ: America/Bogota
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - PETCARE
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1g

volumes:
  petcare_pgdata:

networks:
  PETCARE:
    name: petcare_net
